name: Build APK

# Membangun APK Android dari index.html di root repositori.
# Jalankan dari tab Actions > Build APK > Run workflow (atau otomatis tiap push ke main).

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan proyek Capacitor dari index.html
        run: |
          test -f index.html || { echo "index.html tidak ditemukan di root repositori"; exit 1; }
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "penjaga-fajar",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.penjagafajar.game",
            "appName": "Penjaga Fajar",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Pasang dependensi
        run: npm install

      - name: Tambah platform Android
        run: npx cap add android

      - name: Kunci layar ke potret
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Sinkronkan aset web
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: penjaga-fajar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
